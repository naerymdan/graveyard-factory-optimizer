# Test, then publish a redirect page to GitHub Pages: the site now lives at
# https://graveyard-factory.runoverlabs.dev (repo: runoverlabs/graveyard-factory).
# Enable it once in the repo: Settings -> Pages -> Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main, site]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      # Type-check the JSDoc types (TypeScript is fetched here only; the app has no dependencies).
      - run: npm run typecheck
      # Only the redirect page (index.html, plus 404.html for old deep links) is published.
      - name: Stage the redirect
        run: |
          mkdir _site
          cp .github/pages-redirect/*.html _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
